spring.security.oauth2.client.provider.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:${env.KEYCLOAK_ISSUER_URI:https://keycloak-qa.dokku-00.cs.ucsb.edu/realms/cs156-qa}}
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:${env.KEYCLOAK_CLIENT_SECRET}}
spring.security.oauth2.client.registration.keycloak.client-id=${KEYCLOAK_CLIENT_ID:${env.KEYCLOAK_CLIENT_ID}}
spring.security.oauth2.client.registration.keycloak.scope=openid,profile
app.oauth.login=${OAUTH_LOGIN:${env.OAUTH_LOGIN:/oauth2/authorization/keycloak}}